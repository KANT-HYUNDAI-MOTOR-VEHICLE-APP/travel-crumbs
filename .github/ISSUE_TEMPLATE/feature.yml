name: 새 기능 · 아이디어
description: 만들고 싶은 기능이나 아이디어. AI 가 이 내용으로 스펙을 씀
title: "[기능] "
body:
  - type: markdown
    attributes:
      value: |
        **담당자(Assignees)를 지정해야 AI 가 실행함.** 직접 진행할 사람이면 오른쪽 Assignees 에서 자기 이름을 고름.
        진행은 담당자 본인이 Claude Code 에 「이슈 #번호 진행해줘」.
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - app(차 화면)
        - server
        - 둘 다
        - 모름
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: 누가 · 언제 · 왜
      description: 「(누가) 는 (어떤 상황) 에서 (무엇) 을 하고 싶다. 왜냐하면 (이유)」 꼴로.
      placeholder: 운전자는 차를 세우면(기어 P) 오늘 주행 요약을 듣고 싶다. 주행 중에는 화면을 볼 수 없으니까.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 사용 장면
      description: 처음부터 끝까지 순서대로. 주행 중인지 정차 중인지 꼭 적기(주행 중엔 화면 조작이 제한됨).
      placeholder: |
        1. (주행 중) 목적지에 도착해 기어를 P 로 바꿈
        2. 스피커로 「오늘 32km 달렸어요. 요약을 들어 볼까요?」
        3. 사용자가 「응」이라고 답하면 재생
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 확인할 수 있는 문장으로 한 줄씩. 「~하면 ~가 보인다 · 들린다」. 이게 다 되면 끝.
      placeholder: |
        - [ ] 기어를 P 로 바꾸면 5초 안에 안내 음성이 나옴
        - [ ] 주행 중에는 안내가 나오지 않음
        - [ ] 한 번 정차에 안내는 한 번만
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 이번에 하지 않는 것
      description: AI 가 「하는 김에」 넓히지 않도록. 없으면 비워 둠.
      placeholder: 정차 중 설정 화면은 다음 이슈에서.
  - type: textarea
    id: screen
    attributes:
      label: 화면 · 그림
      description: 스케치 · 캡처 · 참고 앱 화면. 끌어다 놓으면 올라감.
  - type: textarea
    id: data
    attributes:
      label: 데이터
      description: 저장할 것 · 서버로 보낼 것. 정확한 좌표 · 차대번호(VIN) 는 서버로 보내지 않는 게 원칙.
  - type: checkboxes
    id: skip-spec
    attributes:
      label: 스펙 생략
      options:
        - label: 작은 일이라 스펙 없이 바로 구현해도 됨
  - type: textarea
    id: refs
    attributes:
      label: 참고
      description: "관련 이슈 · 문서 · Pleos 문서 주소. 기획 문서가 있으면 위치를 적음 — AI 가 그 아래 문서를 전부 읽음(규칙 docs/spec/README.md)."
      placeholder: |
        기획: share/main · docs/spec/share/
  - type: input
    id: artifact
    attributes:
      label: 산출물
      description: "AI 가 스펙을 쓸 파일. 비워 두면 AI 가 docs/spec/<기능명>/artifacts/ 아래 이름을 제안하고 확인받음. 이미 있는 파일을 적으면 그 파일을 고침."
      placeholder: docs/spec/share/artifacts/share-link.md
