[versions]
agp = "9.4.1"
# AGP 9 는 Kotlin 을 내장함(built-in Kotlin) — 내장 KGP 판과 같은 판을 Compose · serialization · KSP 에 씀
kotlin = "2.2.10"
# AGP 9.0 릴리스 노트가 KGP 2.2.10 에 짝으로 적어 둔 KSP 판
ksp = "2.2.10-2.0.2"
# 2.60 부터 Gradle 플러그인이 kotlin-bom 2.3.21 을 끌어와 내장 Kotlin 2.2.10 과 어긋남 → 2.59.2 로 고정
hilt = "2.59.2"

androidxActivityCompose = "1.12.2"
androidxComposeBom = "2026.01.00"
androidxCoreKtx = "1.17.0"
# 기록 상태 · 임시 저장(앱 종료 · 재부팅 뒤 복원 — 스펙 app-shell D3)
androidxDatastore = "1.1.7"
androidxLifecycle = "2.10.0"
# 핀(여행의 목적지 기록) 기기 원본 — 스펙 navigation 4.1 · U43(Room). 2.8.4 의 컴파일러는 kotlin-stdlib 2.2.0 · 내장 Kotlin 2.2.10 과 맞음
androidxRoom = "2.8.4"

coroutines = "1.10.2"
kotlinxSerialization = "1.9.0"
okhttp = "4.12.0"
retrofit = "2.12.0"

# Pleos SDK
pleosVehicle = "2.3.2"
pleosNaviHelper = "3.0.5"

junit = "4.13.2"
# 0.18 부터 kotlin-compiler-embeddable 2.4.21 을 끌어와 내장 Kotlin 2.2.10 컴파일러가 못 읽음 → 0.17.3
konsist = "0.17.3"
# Compose UI 테스트를 JVM 단위 테스트(testDebugUnitTest)에서 돌림 — 센서 명령이 에뮬레이터 없이 같게
robolectric = "4.16"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCoreKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }

pleos-vehicle = { group = "ai.pleos.playground", name = "Vehicle", version.ref = "pleosVehicle" }
pleos-navi-helper = { group = "ai.pleos.playground", name = "NaviHelper", version.ref = "pleosNaviHelper" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
